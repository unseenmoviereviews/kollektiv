:root{
 --red:#e82d2d; --blue:#2f7bff; --yel:#ffd21e; --grn:#3ad14a; --vio:#a44cff;
 --sky:#5fd0ff; --ink:#ffffff; --mut:#9fb0d4; --dark:#0b0a24; --panel:#141b52;
 --b:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{
 font-family:"PX","Courier New",monospace;
 font-size:16px;line-height:1.5;color:var(--ink);
 background-color:#0b0a24;
 background-image:
  radial-gradient(circle at 6px 6px, rgba(255,255,255,.85) 1px, transparent 1.6px),
  radial-gradient(circle at 40px 28px, rgba(95,208,255,.55) 1px, transparent 1.6px),
  radial-gradient(circle at 20px 52px, rgba(255,210,30,.45) 1px, transparent 1.6px),
  linear-gradient(180deg,#120f3a 0 20%,#17124a 20% 40%,#1c1658 40% 60%,#221a66 60% 80%,#281e74 80% 100%);
 background-size:64px 64px, 96px 96px, 128px 128px, 100% 100%;
 background-repeat:repeat,repeat,repeat,no-repeat;
 background-attachment:scroll;
 padding-bottom:40px;
 -webkit-font-smoothing:none;
 image-rendering:pixelated;
}

/* ====== ШАПКА ====== */
header{position:sticky;top:0;z-index:40;background:#07061a;
 border-bottom:var(--b) solid #000;box-shadow:0 var(--b) 0 0 #ffffff;
 padding:10px 12px calc(10px + env(safe-area-inset-top,0px));
 padding-top:calc(10px + env(safe-area-inset-top,0px))}
.hw{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hw .nm{flex:1 1 auto;min-width:160px;font-size:16px;color:var(--yel);
 text-shadow:2px 2px 0 #000;text-transform:uppercase}
.hw .nm small{display:block;font-size:16px;color:var(--sky);text-shadow:2px 2px 0 #000;text-transform:none}
.badge{background:#1a1550;border:var(--b) solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(255,255,255,.18);
 padding:6px 10px;font-size:16px;color:#fff;white-space:nowrap}
.badge b{color:var(--yel)}
#tm{min-width:92px;text-align:center;color:var(--grn)}
#tm.warn{color:#000;background:var(--yel)}
#tm.crit{color:#fff;background:var(--red);animation:pul .5s steps(2,end) infinite}
@keyframes pul{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.bar{max-width:1000px;margin:10px auto 0;height:12px;background:#000;border:var(--b) solid #000}
.bar i{display:block;height:100%;background:
 repeating-linear-gradient(90deg,var(--grn) 0 8px,#1f9b31 8px 16px);transition:width .2s steps(6,end)}

/* ====== СЕКЦИИ ====== */
main{max-width:1000px;margin:0 auto;padding:18px 12px calc(28px + env(safe-area-inset-bottom,0px))}
section{display:none}
section.on{display:block;background:var(--panel);
 border:var(--b) solid #fff;outline:var(--b) solid #000;outline-offset:0;
 box-shadow:8px 8px 0 rgba(0,0,0,.55);
 padding:18px 16px;margin-top:6px}
h2{font-size:32px;color:var(--yel);text-transform:uppercase;text-shadow:4px 4px 0 #000;
 margin-bottom:12px;line-height:1.35}
.sub{font-size:16px;color:var(--sky);margin-bottom:16px;line-height:1.5}

/* ====== КНОПКИ ====== */
button{font-family:inherit;font-size:16px;color:#000;background:var(--yel);
 border:var(--b) solid #000;
 box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.55),4px 4px 0 rgba(0,0,0,.5);
 padding:10px 16px;cursor:pointer;text-transform:uppercase;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{background:#ffe25c}
button:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.55)}
button:disabled{background:#4a4f78;color:#9aa0c0;cursor:default;
 box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.12)}
button.ghost{background:#2f7bff;color:#fff}
button.ghost:hover{background:#5a9aff}
button.ghost:disabled{background:#4a4f78;color:#9aa0c0}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;
 border-top:var(--b) solid #000;padding-top:16px}
.verdict{font-size:16px;color:var(--mut)}
.verdict.ok{color:var(--grn);text-shadow:2px 2px 0 #000}
.verdict.bad{color:var(--red);text-shadow:2px 2px 0 #000}

/* ====== ОБЩИЕ ПЛИТКИ ====== */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:48px;
 background:#0d0a2e;border:var(--b) solid #000;padding:10px;margin-bottom:16px}
.chip{background:#e8e8f4;color:#000;border:var(--b) solid #000;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;
 padding:8px 10px;font-size:16px;cursor:pointer;max-width:100%;
 -webkit-tap-highlight-color:transparent}
.chip:hover{background:#fff}
.chip.sel{background:var(--yel);transform:translate(-2px,-2px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff,4px 4px 0 #000}
.chip.ok{background:var(--grn);color:#000}
.chip.bad{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.3)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bin{background:#0d0a2e;border:var(--b) solid #fff;outline:var(--b) solid #000;
 padding:12px;min-height:130px;cursor:pointer}
.bin:hover{background:#15104a}
.bin h3{font-size:16px;color:var(--yel);text-transform:uppercase;margin-bottom:10px;
 text-shadow:2px 2px 0 #000;border-bottom:var(--b) solid #000;padding-bottom:8px}
.bin .items{display:flex;flex-direction:column;gap:8px}

/* ====== СОПОСТАВЛЕНИЕ ====== */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h3{font-size:16px;color:var(--sky);text-transform:uppercase;margin-bottom:10px;text-shadow:2px 2px 0 #000}
.mi{background:#e8e8f4;color:#000;border:var(--b) solid #000;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;
 padding:10px;margin-bottom:10px;cursor:pointer;position:relative;
 -webkit-tap-highlight-color:transparent}
.mi:hover{background:#fff}
.mi.sel{background:var(--yel)}
.mi.linked{background:#bcd4ff}
.mi.linked::after{content:attr(data-pair);position:absolute;top:-4px;right:-4px;
 background:var(--vio);color:#fff;border:var(--b) solid #000;
 width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px}
.mi.ok{background:var(--grn);color:#000}
.mi.bad{background:var(--red);color:#fff}

/* ====== КЕЙСЫ И ВАРИАНТЫ ====== */
.case{background:#0d0a2e;border:var(--b) solid #000;border-left:12px solid var(--sky);
 padding:12px;margin:16px 0 10px;font-size:16px;color:#fff;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#e8e8f4;color:#000;border:var(--b) solid #000;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;
 padding:10px;cursor:pointer;font-size:16px;-webkit-tap-highlight-color:transparent}
.opt:hover{background:#fff}
.opt.sel{background:var(--yel)}
.opt.ok{background:var(--grn);color:#000}
.opt.bad{background:var(--red);color:#fff}
.why{display:none;font-size:16px;color:var(--sky);background:#0d0a2e;
 border:var(--b) solid #000;border-left:12px solid var(--yel);padding:10px;margin:8px 0 18px;line-height:1.6}
.why.show{display:block}

/* ====== ВЕРНО/НЕВЕРНО ====== */
.tf{background:#0d0a2e;border:var(--b) solid #000;padding:12px;margin-bottom:12px}
.tf .q{font-size:16px;margin-bottom:10px;line-height:1.6}
.tf .btns{display:flex;gap:10px}
.tf .tb{flex:1;background:#e8e8f4;color:#000;border:var(--b) solid #000;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;
 padding:10px;text-align:center;cursor:pointer;text-transform:uppercase;
 min-height:46px;display:flex;align-items:center;justify-content:center;
 -webkit-tap-highlight-color:transparent}
.tf .tb:hover{background:#fff}
.tf .tb.sel{background:var(--yel)}
.tf .tb.ok{background:var(--grn);color:#000}
.tf .tb.bad{background:var(--red);color:#fff}
.tf.ok{border-color:var(--grn)}
.tf.bad{border-color:var(--red)}

/* ====== НАЙДИ ЛИШНЕЕ ====== */
.odd{background:#0d0a2e;border:var(--b) solid #000;padding:12px;margin-bottom:12px}
.odd .lab{font-size:16px;color:var(--yel);text-transform:uppercase;margin-bottom:10px;text-shadow:2px 2px 0 #000}
.odd .row{display:flex;flex-wrap:wrap;gap:10px}
.odd .w{flex:1 1 180px;background:#e8e8f4;color:#000;border:var(--b) solid #000;
 box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;
 padding:10px;text-align:center;cursor:pointer;min-height:46px;
 display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.odd .w:hover{background:#fff}
.odd .w.sel{background:var(--yel)}
.odd .w.ok{background:var(--grn);color:#000}
.odd .w.bad{background:var(--red);color:#fff}

/* ====== ПРОПУСКИ ====== */
.gap{font-size:16px;line-height:2.4;background:#0d0a2e;border:var(--b) solid #000;padding:14px}
.gap select{font-family:inherit;font-size:16px;background:var(--yel);color:#000;
 border:var(--b) solid #000;padding:4px 6px;margin:0 4px;cursor:pointer;
 -webkit-appearance:none;appearance:none;border-radius:0}
.gap select option{background:#fff;color:#000}
.gap select.ok{background:var(--grn)}
.gap select.bad{background:var(--red);color:#fff}

/* ====== ПОРЯДОК ====== */
.ord{display:flex;flex-direction:column;gap:10px}
.oi{display:flex;align-items:center;gap:10px;background:#e8e8f4;color:#000;
 border:var(--b) solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.28),inset 3px 3px 0 #fff;padding:8px}
.oi .n{flex:0 0 36px;height:36px;display:flex;align-items:center;justify-content:center;
 background:var(--vio);color:#fff;border:var(--b) solid #000;font-size:16px}
.oi .t{flex:1;font-size:16px;line-height:1.5}

 {id:'b1',t:5*60,max:12},{id:'b2',t:5*60,max:8},{id:'b3',t:5*60,max:10},{id:'b4',t:6*60,max:10},
 {id:'b5',t:8*60,max:8},{id:'b6',t:4*60,max:5},{id:'b7',t:4*60,max:6},{id:'b8',t:7*60,max:7},
 {id:'b9',t:5*60,max:8},{id:'b10',t:4*60,max:6},{id:'fin',t:0}];
const MAXSUM=BLOCKS.reduce((s,b)=>s+(b.max||0),0);
let cur=0,score=0,res={},T={left:0,h:null};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function el(id){return document.getElementById(id)}
function addScore(n){score+=n;el('sc').textContent=score}
function tfmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function tstart(sec){tstop();if(!sec){el('tm').textContent='—';el('tm').className='badge';return}
 T.left=sec;el('tm').textContent=tfmt(T.left);el('tm').className='badge';
 T.h=setInterval(()=>{T.left--;el('tm').textContent=tfmt(Math.max(0,T.left));
  el('tm').className='badge'+(T.left<=30?' crit':T.left<=60?' warn':'');
  if(T.left<=0){tstop();fx(false,'ВРЕМЯ ВЫШЛО');autocheck()}},1000)}
function tstop(){if(T.h)clearInterval(T.h);T.h=null}
function autocheck(){const b=BLOCKS[cur].id;const f={b1:check1,b2:check2,b3:check3,b4:check4,b5:check5,
 b6:check6,b7:check7,b8:check8,b9:check9,b10:check10}[b];if(f)f()}
function show(){const t=el('toast');if(t){t.classList.remove('show');clearTimeout(t._h)}
 document.querySelectorAll('section').forEach((s,i)=>s.classList.toggle('on',i===cur));
 el('bn').textContent=Math.min(Math.max(cur,0),10);
 el('pb').style.width=(cur/(BLOCKS.length-1)*100)+'%';
 tstart(BLOCKS[cur].t);window.scrollTo({top:0});
 if(BLOCKS[cur].id==='fin')fin()}
function go(d){cur=Math.max(0,Math.min(BLOCKS.length-1,cur+d));show()}

function fx(good,txt){const f=el('fx');f.className='';void f.offsetWidth;f.className=good?'ok':'bad';
 if(!good){document.body.classList.remove('shake');void document.body.offsetWidth;
  document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),700)}
 const t=el('toast');t.textContent=txt||(good?'ОТЛИЧНО!':'ЕСТЬ ОШИБКИ');
 t.className=(good?'ok':'bad')+' show';clearTimeout(t._h);
 t._h=setTimeout(()=>t.classList.remove('show'),good?1200:1600);
 try{if(!window._ac){window._ac=new (window.AudioContext||window.webkitAudioContext)()}
  const a=window._ac;if(a.state==='suspended')a.resume();
  const o=a.createOscillator(),g=a.createGain();o.type='square';
  o.frequency.setValueAtTime(good?660:200,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(good?1320:110,a.currentTime+.18);
  g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2)}catch(e){}}

/* --- сортировка (универсальная) --- */
function mkSort(poolId,binsId,cards,bins,state){
 const pool=el(poolId);
 cards.map((c,i)=>i).sort(()=>Math.random()-.5).forEach(i=>{
  const d=document.createElement('div');d.className='chip';d.textContent=cards[i].t;d.dataset.i=i;
  d.onclick=()=>{if(state.done)return;
   if(d.parentNode.classList.contains('items')){
    if(state.sel&&state.sel!==d){d.parentNode.appendChild(state.sel);state.sel.classList.remove('sel');state.sel=null;
     if(innerWidth<860&&pool.children.length)pool.scrollIntoView({behavior:'smooth',block:'center'});return}
    pool.appendChild(d);d.classList.remove('sel');state.sel=null;return}
   pool.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
   if(state.sel===d){state.sel=null;return}
   d.classList.add('sel');state.sel=d;
   if(innerWidth<860)el(binsId).scrollIntoView({behavior:'smooth',block:'center'})};
  pool.appendChild(d)});
 const box=el(binsId);
 bins.forEach(b=>{const e=document.createElement('div');e.className='bin';e.dataset.k=b.k;
  e.innerHTML='<h3>'+b.t+'</h3><div class="items"></div>';
  e.onclick=()=>{if(state.done||!state.sel)return;
   e.querySelector('.items').appendChild(state.sel);state.sel.classList.remove('sel');state.sel=null;
   if(innerWidth<860&&pool.children.length)pool.scrollIntoView({behavior:'smooth',block:'center'})};
  box.appendChild(e)})}
function checkSort(poolId,binsId,cards,state,vid,btn,nxt,label,max){
 if(state.done)return;state.done=true;let n=0;
 document.querySelectorAll('#'+binsId+' .chip').forEach(c=>{
  const k=cards[+c.dataset.i].k,inb=c.closest('.bin').dataset.k;
  c.classList.add(k===inb?'ok':'bad');if(k===inb)n++});
 document.querySelectorAll('#'+poolId+' .chip').forEach(c=>c.classList.add('bad'));
 addScore(n);res[label]=n+' / '+max;
 el(vid).textContent='Верно: '+n+' из '+max;el(vid).className='verdict '+(n>=max*0.75?'ok':'bad');
 el(btn).disabled=true;el(nxt).disabled=false;tstop();fx(n===max)}

/* --- кейсы с вариантами --- */
function buildQ(host,data,pre){const box=el(host);
 data.forEach((q,qi)=>{const w=document.createElement('div');
  w.innerHTML='<div class="case">'+esc(q.c)+'</div><div class="opts" id="'+pre+qi+'"></div>'+
   '<div class="why" id="w'+pre+qi+'">'+esc(q.w)+'</div>';
  box.appendChild(w);const o=w.querySelector('.opts');
  q.o.forEach((t,oi)=>{const d=document.createElement('div');d.className='opt';d.textContent=t;d.dataset.o=oi;
   d.onclick=()=>{if(o.dataset.lock)return;
    o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel')};
   o.appendChild(d)})})}
function checkQ(data,pre,vid,btn,nxt,label,max){let n=0;
 data.forEach((q,qi)=>{const o=el(pre+qi);if(o.dataset.lock)return;o.dataset.lock=1;
  o.querySelectorAll('.opt').forEach(d=>{const i=+d.dataset.o;
   if(i===q.a)d.classList.add('ok');else if(d.classList.contains('sel'))d.classList.add('bad')});
  const s=o.querySelector('.opt.sel');if(s&&+s.dataset.o===q.a)n++;
  el('w'+pre+qi).classList.add('show')});
 addScore(n);res[label]=n+' / '+max;
 el(vid).textContent='Верно: '+n+' из '+max;el(vid).className='verdict '+(n>=max-1?'ok':'bad');
 el(btn).disabled=true;el(nxt).disabled=false;tstop();fx(n===max)}

/* --- блоки --- */
const st1={},st3={};
function check1(){checkSort('pool1','bins1',CARDS,st1,'v1','bt1','nx1','Стороны общения',12)}
let selL=null,links={},d2=false;
function check2(){if(d2)return;d2=true;let n=0;
 document.querySelectorAll('#mL .mi').forEach(a=>{const i=+a.dataset.i,j=links[i],good=(j===i);
  a.classList.add(good?'ok':'bad');
  if(j!==undefined)document.querySelector('#mR [data-j="'+j+'"]').classList.add(good?'ok':'bad');
  if(good)n++});
 addScore(n);res['Роли и ожидания']=n+' / 8';
 el('v2').textContent='Верно: '+n+' из 8';el('v2').className='verdict '+(n>=6?'ok':'bad');
 el('bt2').disabled=true;el('nx2').disabled=false;tstop();fx(n===8)}
function check3(){checkSort('pool3','bins3',SCARDS,st3,'v3','bt3','nx3','Виды статусов',10)}
let d4=false;
function check4(){if(d4)return;d4=true;let n=0;
 TF.forEach((q,i)=>{const box=el('tf'+i),pick=box.dataset.v;
  box.querySelectorAll('.tb').forEach(b=>{const v=b.dataset.v==='1';
   if(v===q.a)b.classList.add('ok');else if(pick===b.dataset.v)b.classList.add('bad')});
  const good=(pick!==undefined&&(pick==='1')===q.a);
  box.classList.add(good?'ok':'bad');if(good)n++;
  el('wtf'+i).classList.add('show')});
 addScore(n);res['Верно или неверно']=n+' / 10';
 el('v4').textContent='Верно: '+n+' из 10';el('v4').className='verdict '+(n>=8?'ok':'bad');
 el('bt4').disabled=true;el('nx4').disabled=false;tstop();fx(n===10)}
let d5=false;
function check5(){if(d5)return;d5=true;checkQ(Q3,'q5o','v5','bt5','nx5','Стратегии в конфликте',8)}
let d6=false;
function check6(){if(d6)return;d6=true;let n=0;
 ODD.forEach((r,i)=>{const box=el('od'+i);
  box.querySelectorAll('.w').forEach(w=>{const j=+w.dataset.j;
   if(j===r.a)w.classList.add('ok');else if(w.classList.contains('sel'))w.classList.add('bad')});
  const s=box.querySelector('.w.sel');if(s&&+s.dataset.j===r.a)n++;
  el('wod'+i).classList.add('show')});
 addScore(n);res['Найди лишнее']=n+' / 5';
 el('v6').textContent='Верно: '+n+' из 5';el('v6').className='verdict '+(n>=4?'ok':'bad');
 el('bt6').disabled=true;el('nx6').disabled=false;tstop();fx(n===5)}
let d7=false;
function check7(){if(d7)return;d7=true;let n=0;
 document.querySelectorAll('#q7 .opt').forEach(d=>{const q=Q4[+d.dataset.i],p=d.classList.contains('sel');
  if(q.ok){d.classList.add(p?'ok':'bad');if(p)n++}else if(p){d.classList.add('bad');n--}});
 n=Math.max(0,n);addScore(n);res['Факторы престижа']=n+' / 6';
 el('v7').textContent='Набрано: '+n+' из 6';el('v7').className='verdict '+(n>=5?'ok':'bad');
 el('bt7').disabled=true;el('nx7').disabled=false;tstop();fx(n===6)}
let d8=false;
function check8(){if(d8)return;d8=true;checkQ(Q5,'q8o','v8','bt8','nx8','Ошибки общения',7)}
let d9=false;
function check9(){if(d9)return;d9=true;let n=0;
 document.querySelectorAll('#q9 select').forEach(s=>{const good=(s.value===s.dataset.a);
  s.classList.add(good?'ok':'bad');s.disabled=true;if(good)n++});
 addScore(n);res['Термины в тексте']=n+' / 8';
 el('v9').textContent='Верно: '+n+' из 8';el('v9').className='verdict '+(n>=6?'ok':'bad');
 el('bt9').disabled=true;el('nx9').disabled=false;tstop();fx(n===8)}
let ord=[],d10=false;
function draw10(){const box=el('q10');box.innerHTML='';
 ord.forEach((v,i)=>{const d=document.createElement('div');d.className='oi';d.dataset.v=v;
  d.innerHTML='<span class="n">'+(i+1)+'</span><span class="t">'+esc(ORDER[v])+'</span>';
  if(!d10){const up=document.createElement('button');up.className='ghost';up.textContent='↑';
   up.onclick=()=>{if(i>0){[ord[i-1],ord[i]]=[ord[i],ord[i-1]];draw10()}};
   const dn=document.createElement('button');dn.className='ghost';dn.textContent='↓';
   dn.onclick=()=>{if(i<ord.length-1){[ord[i+1],ord[i]]=[ord[i],ord[i+1]];draw10()}};
   d.appendChild(up);d.appendChild(dn)}
  box.appendChild(d)})}
function check10(){if(d10)return;d10=true;let n=0;
 ord.forEach((v,i)=>{if(v===i)n++});draw10();
 document.querySelectorAll('#q10 .oi').forEach((d,i)=>d.classList.add(ord[i]===i?'ok':'bad'));
 addScore(n);res['Порядок шагов']=n+' / 6';
 el('v10').textContent='На своих местах: '+n+' из 6';el('v10').className='verdict '+(n>=5?'ok':'bad');
 el('bt10').disabled=true;el('nx10').disabled=false;tstop();fx(n===6)}

/* --- итог --- */
function grade(p){return p>=.88?5:p>=.72?4:p>=.55?3:p>=.35?2:1}
function fin(){tstop();el('tm').textContent='—';el('tm').className='badge';
 const p=score/MAXSUM,g=grade(p);
 el('fg').textContent=g;
 el('fgs').textContent={5:'отлично',4:'хорошо',3:'удовлетворительно',2:'неудовлетворительно',1:'тему нужно повторить'}[g];
 el('fsc').textContent=score;el('fmax').textContent=MAXSUM;
 el('fwho').textContent=el('name').value||'';
 let h='';for(const k in res)h+='<tr><td>'+k+'</td><td>'+res[k]+'</td></tr>';
 el('ftab').innerHTML=h}
function dl(){const name=el('name').value||'без имени';
 let s='Тема 1.5. Интерактивная работа\nСтудент: '+name+'\nОценка: '+grade(score/MAXSUM)+
  '\nБаллы: '+score+' из '+MAXSUM+'\n\n';
 for(const k in res)s+=k+': '+res[k]+'\n';
 const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios||typeof document.createElement('a').download==='undefined'){
  const w=el('copybox');w.style.display='block';w.querySelector('textarea').value=s;return}
 const b=new Blob([s],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='Результат — '+name+'.txt';a.click()}
function copyAll(){const t=el('copybox').querySelector('textarea');t.select();t.setSelectionRange(0,99999);
 try{document.execCommand('copy');alert('Скопировано')}catch(e){alert('Выделите текст и скопируйте вручную')}}

/* ===================== РАЗМЕТКА ===================== */
const M=el('main');
function sec(html){const s=document.createElement('section');s.innerHTML=html;M.appendChild(s);return s}
function head(n,t,sub,pts){return '<h2>Блок '+n+'. '+t+'</h2><p class="sub">'+sub+' '+pts+' баллов.</p>'}
function navr(n){return '<div class="nav"><button id="bt'+n+'" onclick="check'+n+'()">Проверить</button>'+
 '<button class="ghost" id="nx'+n+'" onclick="go(1)" disabled>Дальше →</button>'+
 '<span class="verdict" id="v'+n+'"></span></div>'}

sec(`<div class="start"><h2>Интерактивная работа по теме 1.5</h2>
 <p class="sub">Межличностное общение в профессиональном сообществе · Престиж профессии · Роли в трудовом коллективе</p>
 <p>Введите фамилию и имя — они появятся на итоговом экране, который вы покажете преподавателю.</p>
 <p style="margin:12px 0"><input type="text" id="name" placeholder="Фамилия, имя" autocomplete="off"></p>
 <p>Работа состоит из десяти блоков. На каждый даётся своё время, таймер идёт сверху. Когда время заканчивается,
  блок проверяется автоматически. Вернуться к пройденному блоку нельзя. В конце выставляется оценка от 1 до 5.</p>
 <div class="nav"><button onclick="if(!el('name').value.trim()){alert('Введите фамилию и имя');return} go(1)">Начать работу</button></div></div>`);

sec(head(1,'Три стороны общения','Щёлкните по примеру, затем по нужному полю.',12)+
 '<div class="pool" id="pool1"></div><div class="bins" id="bins1"></div>'+navr(1));

sec(head(2,'Роль в коллективе и ожидания','Щёлкните по роли слева, затем по ожиданию справа.',8)+
 '<div class="match"><div class="col"><h3>Роль</h3><div id="mL"></div></div>'+
 '<div class="col"><h3>Чего ждёт коллектив</h3><div id="mR"></div></div></div>'+navr(2));

sec(head(3,'Предписанный и достигаемый статус','Распределите статусы по двум полям.',10)+
 '<div class="pool" id="pool3"></div><div class="bins" id="bins3"></div>'+navr(3));

sec(head(4,'Верно или неверно','Выберите ответ для каждого суждения.',10)+'<div id="q4"></div>'+navr(4));

sec(head(5,'Стратегия поведения в конфликте','Выберите стратегию, уместную в каждой ситуации.',8)+
 '<div id="q5"></div>'+navr(5));

sec(head(6,'Найди лишнее','В каждом ряду одно понятие выпадает из общего основания.',5)+
 '<div id="q6"></div>'+navr(6));

sec(head(7,'От чего зависит престиж профессии','Отметьте все подходящие факторы. Лишние отметки снижают результат.',6)+
 '<div class="opts" id="q7"></div>'+navr(7));

sec(head(8,'Ошибки делового общения','В каждом случае выберите, что нарушено.',7)+'<div id="q8"></div>'+navr(8));

sec(head(9,'Термины в тексте','Выберите подходящий термин в каждом пропуске.',8)+
 '<div class="gap" id="q9"></div>'+navr(9));

sec(head(10,'Порядок шагов','Расставьте стрелками шаги разрешения конфликта по порядку.',6)+
 '<div class="ord" id="q10"></div>'+navr(10));

sec(`<div id="fin"><div class="who" id="fwho"></div>
 <div class="gsub">Оценка за работу</div>
 <div class="grade" id="fg">—</div>
 <div class="mark" id="fgs"></div>
 <div style="font-size:19px;margin-top:10px;color:#9fb0d4"><span id="fsc">0</span> из <span id="fmax">0</span> баллов</div>
 <table id="ftab"></table>
 <div id="copybox" style="display:none;margin-top:16px;text-align:left">
  <textarea readonly style="min-height:150px"></textarea>
  <div class="nav" style="justify-content:center"><button class="ghost" onclick="copyAll()">Скопировать</button></div></div>
 <div class="nav" style="justify-content:center"><button class="ghost" onclick="dl()">Сохранить результат</button>
  <button class="ghost" onclick="if(confirm('Начать заново?'))location.reload()">Пройти заново</button></div></div>`);

/* ===================== НАПОЛНЕНИЕ ===================== */
(function(){
 mkSort('pool1','bins1',CARDS,BINS,st1);
 mkSort('pool3','bins3',SCARDS,SBINS,st3);

 const L=el('mL'),R=el('mR');
 PAIRS.forEach((p,i)=>{const a=document.createElement('div');a.className='mi';a.textContent=p[0];a.dataset.i=i;
  a.onclick=()=>{if(d2)return;
   if(links[i]!==undefined){const o=R.querySelector('[data-j="'+links[i]+'"]');o.classList.remove('linked');
    o.removeAttribute('data-pair');a.classList.remove('linked');a.removeAttribute('data-pair');delete links[i];return}
   L.querySelectorAll('.mi').forEach(x=>x.classList.remove('sel'));
   if(selL===a){selL=null;return}a.classList.add('sel');selL=a;
   if(innerWidth<860)R.scrollIntoView({behavior:'smooth',block:'start'})};
  L.appendChild(a)});
 PAIRS.map((p,i)=>i).sort(()=>Math.random()-.5).forEach(j=>{
  const b=document.createElement('div');b.className='mi';b.textContent=PAIRS[j][1];b.dataset.j=j;
  b.onclick=()=>{if(d2||!selL)return;if(Object.values(links).includes(j))return;
   const i=+selL.dataset.i,n=Object.keys(links).length+1;
   links[i]=j;selL.classList.remove('sel');selL.classList.add('linked');selL.dataset.pair=n;
   b.classList.add('linked');b.dataset.pair=n;selL=null;
   if(innerWidth<860)L.scrollIntoView({behavior:'smooth',block:'start'})};
  R.appendChild(b)});

 const q4=el('q4');
 TF.forEach((q,i)=>{const d=document.createElement('div');d.className='tf';d.id='tf'+i;
  d.innerHTML='<div class="q">'+(i+1)+'. '+esc(q.q)+'</div><div class="btns">'+
   '<div class="tb" data-v="1">Верно</div><div class="tb" data-v="0">Неверно</div></div>'+
   '<div class="why" id="wtf'+i+'">'+esc(q.w)+'</div>';
  d.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{if(d4)return;
   d.querySelectorAll('.tb').forEach(x=>x.classList.remove('sel'));
   b.classList.add('sel');d.dataset.v=b.dataset.v});
  q4.appendChild(d)});

 buildQ('q5',Q3,'q5o');buildQ('q8',Q5,'q8o');

 const q6=el('q6');
 ODD.forEach((r,i)=>{const d=document.createElement('div');d.className='odd';
  d.innerHTML='<div class="lab">'+esc(r.lab)+'</div><div class="row" id="od'+i+'"></div>'+
   '<div class="why" id="wod'+i+'">'+esc(r.x)+'</div>';
  q6.appendChild(d);const row=d.querySelector('.row');
  r.w.map((t,j)=>j).sort(()=>Math.random()-.5).forEach(j=>{const t=r.w[j];
   const w=document.createElement('div');w.className='w';w.textContent=t;w.dataset.j=j;
   w.onclick=()=>{if(d6)return;row.querySelectorAll('.w').forEach(x=>x.classList.remove('sel'));w.classList.add('sel')};
   row.appendChild(w)})});

 const q7=el('q7');
 Q4.map((q,i)=>i).sort(()=>Math.random()-.5).forEach(i=>{
  const d=document.createElement('div');d.className='opt';d.textContent=Q4[i].t;d.dataset.i=i;
  d.onclick=()=>{if(!d7)d.classList.toggle('sel')};q7.appendChild(d)});

 let html='';GAPS.forEach(g=>{html+=esc(g.pre);
  if(g.a)html+='<select data-a="'+esc(g.a)+'"><option value="">— выберите —</option>'+
   GOPTS.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>'});
 el('q9').innerHTML=html;

 ord=ORDER.map((v,i)=>i).sort(()=>Math.random()-.5);draw10();
 show();
})();
</script>
</body></html>
